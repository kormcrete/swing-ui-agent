<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="How it fits together: a person at the app or a coding agent, over the palette or the CLI and MCP on loopback, reach the agent jar inside the app's JVM; it writes recorded tests to uitest, which the palette, the agent, Maven and CI replay">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b2d8ff"/>
    </marker>
  </defs>
  <rect width="560" height="300" rx="16" fill="#1a4a6b"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#f2f5f8" text-anchor="middle">
    <!-- who -->
    <rect x="20" y="34" width="150" height="54" rx="10" fill="#17456a" stroke="#7fa9c9"/>
    <text x="95" y="56" font-weight="700">A person at the app</text>
    <text x="95" y="76" fill="#b2d8ff">palette: ● Record, Check</text>
    <rect x="20" y="118" width="150" height="54" rx="10" fill="#17456a" stroke="#7fa9c9"/>
    <text x="95" y="140" font-weight="700">A coding agent</text>
    <text x="95" y="160" fill="#b2d8ff">CLI or MCP, loopback only</text>
    <!-- app jvm -->
    <rect x="210" y="34" width="150" height="138" rx="10" fill="#0f1a24" stroke="#76d8ff" stroke-width="1.5"/>
    <text x="285" y="56" font-weight="700">Your Swing app</text>
    <text x="285" y="74" fill="#b2d8ff">unchanged, in its JVM</text>
    <rect x="226" y="92" width="118" height="62" rx="8" fill="#1a4a6b" stroke="#7fa9c9"/>
    <text x="285" y="115" font-weight="700">agent jar</text>
    <text x="285" y="133" fill="#b2d8ff">-javaagent:</text>
    <text x="285" y="148" fill="#b2d8ff" font-size="11">clicks, types, reads, waits</text>
    <!-- recorded test -->
    <rect x="400" y="34" width="140" height="138" rx="10" fill="#17456a" stroke="#7fa9c9"/>
    <text x="470" y="58" font-weight="700">Recorded test</text>
    <text x="470" y="78" fill="#b2d8ff" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">uitest/place-order.json</text>
    <text x="470" y="104" font-size="12">a sentence per step,</text>
    <text x="470" y="120" font-size="12">checks under their step,</text>
    <text x="470" y="136" font-size="12">exact values, nothing</text>
    <text x="470" y="152" font-size="12">to compile</text>
    <!-- replay -->
    <rect x="20" y="212" width="520" height="56" rx="10" fill="#17456a" stroke="#7fa9c9"/>
    <text x="280" y="235" font-weight="700">Replays from</text>
    <text x="280" y="255" fill="#b2d8ff">the palette (▶ Run) · the agent · Maven (JUnit runner) · CI under a virtual display</text>
  </g>
  <g stroke="#b2d8ff" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M170 61 H210"/>
    <path d="M170 145 H210"/>
    <path d="M360 103 H400"/>
    <path d="M470 172 V212"/>
    <path d="M285 172 V212"/>
  </g>
</svg>
