name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS / Java ${{ matrix.java }}
    # One jar for every Java: it is built on JDK 8 (x86_64, under Rosetta on arm64 runners) and its test suite then
    # runs on each LTS release (native arm64 from 11 on), the versions the README promises.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - name: Set up the test JDK
        id: test-jdk
        if: matrix.java != '8'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - name: Set up the build JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          architecture: x64
          cache: maven
      - name: Build and test
        run: mvn -B verify ${{ matrix.java != '8' && format('-Djvm={0}/bin/java', steps.test-jdk.outputs.path) || '' }}
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-macos-java${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  badges:
    name: Publish badges
    # One job writes both badges: each publish replaces the whole 'badges' branch.
    needs: macos
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the 'badges' branch
      actions: read # reads this run's job results
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Java 8 test reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-reports-macos-java8
          path: reports
      - name: Build the badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          python3 .github/scripts/test-badge.py reports > "$RUNNER_TEMP/badges/tests.json"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 .github/scripts/java-badge.py "$RUNNER_TEMP/jobs.json" > "$RUNNER_TEMP/badges/java.json"
          cat "$RUNNER_TEMP"/badges/*.json
      - name: Publish the badges
        run: |
          cd "$RUNNER_TEMP/badges"
          git init -q
          git checkout -q --orphan badges
          git config user.name kormcrete
          git config user.email 249758029+kormcrete@users.noreply.github.com
          git add tests.json java.json
          git commit -q -m "badges"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges

  linux:
    name: Linux / Java 8 (driver not supported yet)
    runs-on: ubuntu-latest
    # Until a Linux seam exists this lane may fail; it must not fail the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          cache: maven
      - name: Build and test (virtual display)
        run: xvfb-run -a mvn -B verify
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: target/surefire-reports/
          if-no-files-found: ignore
