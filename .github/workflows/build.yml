name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One jar for every Java and OS: each job builds it on JDK 8 and runs the unit tests and the end-to-end test
# (FixtureAppDriveIT: an app started with the packaged agent jar, driven through the CLI) on the job's Java.
# Job names '<OS> / Java N' feed the badges (.github/scripts/job-badges.py).
jobs:
  macos:
    name: macOS / Java ${{ matrix.java }}
    # The build JDK is x86_64 (under Rosetta on arm64 runners); the test JVM is native arm64 from 11 on.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    steps:
      - uses: actions/checkout@v7
      - name: Set up the test JDK
        id: test-jdk
        if: matrix.java != '8'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - name: Set up the build JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '8'
          architecture: x64
          cache: maven
      - name: Build and test
        run: mvn -B verify ${{ matrix.java != '8' && format('-Djvm={0}/bin/java', steps.test-jdk.outputs.path) || '' }}
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos-java${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  linux:
    name: Linux / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '25']
    steps:
      - uses: actions/checkout@v7
      - name: Set up the test JDK
        id: test-jdk
        if: matrix.java != '8'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - name: Set up the build JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '8'
          cache: maven
      - name: Build and test (virtual display)
        run: xvfb-run -a mvn -B verify ${{ matrix.java != '8' && format('-Djvm={0}/bin/java', steps.test-jdk.outputs.path) || '' }}
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux-java${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  windows:
    name: Windows / Java ${{ matrix.java }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '25']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up the test JDK
        id: test-jdk
        if: matrix.java != '8'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - name: Set up the build JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '8'
          cache: maven
      - name: Build and test
        run: mvn -B verify ${{ matrix.java != '8' && format('"-Djvm={0}/bin/java.exe"', steps.test-jdk.outputs.path) || '' }}
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows-java${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  badges:
    name: Publish badges
    # One job writes every badge: each publish replaces the whole 'badges' branch.
    needs: [macos, linux, windows]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the 'badges' branch
      actions: read # reads this run's job results
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the macOS Java 8 test reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-reports-macos-java8
          path: reports
      - name: Build the badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          python3 .github/scripts/test-badge.py reports/surefire-reports > "$RUNNER_TEMP/badges/tests.json"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 .github/scripts/job-badges.py "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/badges"
          cat "$RUNNER_TEMP"/badges/*.json
      - name: Publish the badges
        run: |
          cd "$RUNNER_TEMP/badges"
          git init -q
          git checkout -q --orphan badges
          git config user.name kormcrete
          git config user.email 249758029+kormcrete@users.noreply.github.com
          git add tests.json java.json platform.json
          git commit -q -m "badges"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
